name: Build Windows Installer

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/RestaurantWiFiControl/RestaurantWiFiControl.csproj

      - name: Publish self-contained Windows app
        run: >
          dotnet publish src/RestaurantWiFiControl/RestaurantWiFiControl.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o installer/publish

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\RestaurantWiFiControl.iss"'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Restaurant-WiFi-Control-V9-Setup
          path: installer/output/Restaurant_WiFi_Control_V9_Setup.exe
          if-no-files-found: error
