name: Build Windows Installer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore desktop app
        run: dotnet restore src/RestaurantWiFiControl/RestaurantWiFiControl.csproj

      - name: Restore gateway service
        run: dotnet restore src/RestaurantWiFiGateway/RestaurantWiFiGateway.csproj

      - name: Run SQLite migration and concurrency integration tests
        run: dotnet run --project tests/RestaurantWiFiStorage.Tests/RestaurantWiFiStorage.Tests.csproj -c Release

      - name: Publish self-contained Windows app
        run: >
          dotnet publish src/RestaurantWiFiControl/RestaurantWiFiControl.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o installer/publish

      - name: Publish gateway service
        run: >
          dotnet publish src/RestaurantWiFiGateway/RestaurantWiFiGateway.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o installer/gateway

      - name: Smoke-test native Windows WFP per-client filter transactions (synthetic adapters)
        shell: pwsh
        timeout-minutes: 2
        run: |
          & installer/gateway/RestaurantWiFiGateway.exe --wfp-smoke
          if ($LASTEXITCODE -ne 0) { throw "WFP smoke test failed: exit code $LASTEXITCODE" }

      - name: Smoke-test Windows Gateway admin IPC
        shell: pwsh
        run: ./tests/Smoke-WindowsGateway.ps1

      - name: Smoke-test real Windows Service Control Manager startup (1053 regression)
        shell: pwsh
        timeout-minutes: 3
        run: ./tests/Smoke-WindowsService.ps1

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: powershell
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\RestaurantWiFiControl.iss"'

      - name: Smoke-test fresh and upgrade Windows installer (missing service regression)
        shell: pwsh
        timeout-minutes: 5
        run: ./tests/Smoke-WindowsInstaller.ps1

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Restaurant-WiFi-Control-V9.3.6-Trial-Accounting
          path: installer/output/Restaurant_WiFi_Control_V9_3_6_Trial_Accounting_Setup.exe
          if-no-files-found: error
